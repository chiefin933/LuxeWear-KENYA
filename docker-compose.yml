services:
  postgres:
    image: postgres:16-alpine
    container_name: luxewear-postgres
    restart: always
    environment:
      POSTGRES_USER: luxewear
      POSTGRES_PASSWORD: luxewear_secret
      POSTGRES_DB: luxewear_db
    ports:
      - "5435:5432"
    volumes:
      - luxewear_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxewear -d luxewear_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: luxewear-redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  luxewear_pgdata:
